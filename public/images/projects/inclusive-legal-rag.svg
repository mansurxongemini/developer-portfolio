<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="600" cy="240" r="300" fill="url(#glow)"/>
  
  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Legal scales & AI node icon -->
  <g transform="translate(600, 220)" stroke="url(#accent)" stroke-width="3" fill="none">
    <circle cx="0" cy="0" r="80" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
    <circle cx="0" cy="0" r="50" stroke-width="3"/>
    <!-- Central scale post -->
    <line x1="0" y1="-30" x2="0" y2="30"/>
    <line x1="-35" y1="-20" x2="35" y2="-20"/>
    <!-- Left pan -->
    <path d="M -35 -20 L -45 5 L -25 5 Z" fill="#38bdf8" fill-opacity="0.2"/>
    <!-- Right pan -->
    <path d="M 35 -20 L 25 5 L 45 5 Z" fill="#818cf8" fill-opacity="0.2"/>
  </g>

  <!-- Badge -->
  <rect x="475" y="340" width="250" height="36" rx="18" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3"/>
  <text x="600" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="3">LEGALTECH &amp; RAG</text>

  <!-- Title -->
  <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">Inclusive Legal AI &amp; RAG</text>
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">Statutory Intelligence Platform for Disability Rights</text>

  <!-- Tech tags -->
  <g transform="translate(600, 540)" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    <text x="-180" y="0">FastAPI</text>
    <circle cx="-130" cy="-4" r="3" fill="#38bdf8"/>
    <text x="-70" y="0">LanceDB</text>
    <circle cx="-20" cy="-4" r="3" fill="#38bdf8"/>
    <text x="40" y="0">Hybrid RRF</text>
    <circle cx="100" cy="-4" r="3" fill="#38bdf8"/>
    <text x="170" y="0">Python</text>
  </g>
</svg>
