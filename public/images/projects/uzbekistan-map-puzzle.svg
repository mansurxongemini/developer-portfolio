<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="accent7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow7" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg7)"/>
  <circle cx="600" cy="240" r="300" fill="url(#glow7)"/>
  
  <!-- Map puzzle / Compass & Regional puzzle icon -->
  <g transform="translate(600, 220)" stroke="url(#accent7)" stroke-width="3" fill="none">
    <!-- Stylized regional contour / puzzle piece -->
    <path d="M -60 -40 C -40 -60 0 -50 20 -40 C 40 -30 60 -50 70 -20 C 80 10 60 40 40 50 C 20 60 -20 50 -50 40 C -70 30 -80 -10 -60 -40 Z" fill="#14b8a6" fill-opacity="0.18"/>
    <!-- Compass star in center -->
    <polygon points="0,-30 6,-8 28,0 6,8 0,30 -6,8 -28,0 -6,-8" fill="#ffffff" fill-opacity="0.7" stroke="none"/>
    <circle cx="0" cy="0" r="45" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Badge -->
  <rect x="445" y="345" width="310" height="36" rx="18" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.3"/>
  <text x="600" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="3">EDUCATIONAL GEOGRAPHY</text>

  <!-- Title -->
  <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">Uzbekistan Map Puzzle</text>
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#99f6e4" text-anchor="middle">Interactive Regional Geography &amp; Cognitive Quiz Game</text>

  <!-- Tech tags -->
  <g transform="translate(600, 540)" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    <text x="-190" y="0">JavaScript</text>
    <circle cx="-135" cy="-4" r="3" fill="#14b8a6"/>
    <text x="-75" y="0">SVG Map</text>
    <circle cx="-20" cy="-4" r="3" fill="#14b8a6"/>
    <text x="45" y="0">Interactive Canvas</text>
    <circle cx="125" cy="-4" r="3" fill="#14b8a6"/>
    <text x="180" y="0">HTML5</text>
  </g>
</svg>
