<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg5)"/>
  <circle cx="600" cy="240" r="300" fill="url(#glow5)"/>
  
  <!-- Community / Governance building icon -->
  <g transform="translate(600, 220)" stroke="url(#accent5)" stroke-width="3" fill="none">
    <!-- Roof pediment -->
    <path d="M -70 -20 L 0 -60 L 70 -20 Z" fill="#f59e0b" fill-opacity="0.15"/>
    <!-- Pillars -->
    <line x1="-50" y1="-20" x2="-50" y2="40"/>
    <line x1="-20" y1="-20" x2="-20" y2="40"/>
    <line x1="20" y1="-20" x2="20" y2="40"/>
    <line x1="50" y1="-20" x2="50" y2="40"/>
    <!-- Base -->
    <line x1="-70" y1="40" x2="70" y2="40" stroke-width="4"/>
    <line x1="-80" y1="52" x2="80" y2="52" stroke-width="4"/>
  </g>

  <!-- Badge -->
  <rect x="440" y="345" width="320" height="36" rx="18" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.3"/>
  <text x="600" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle" letter-spacing="3">GOVTECH &amp; CIVIC AUTOMATION</text>

  <!-- Title -->
  <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">Mahalla Management Suite</text>
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="middle">Civil Registry Ingestion &amp; Community Workflow Automation</text>

  <!-- Tech tags -->
  <g transform="translate(600, 540)" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    <text x="-180" y="0">Python</text>
    <circle cx="-135" cy="-4" r="3" fill="#f59e0b"/>
    <text x="-75" y="0">Playwright</text>
    <circle cx="-15" cy="-4" r="3" fill="#f59e0b"/>
    <text x="50" y="0">OpenPyXL</text>
    <circle cx="115" cy="-4" r="3" fill="#f59e0b"/>
    <text x="180" y="0">GovTech</text>
  </g>
</svg>
