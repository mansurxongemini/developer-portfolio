<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021f18"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg3)"/>
  <circle cx="600" cy="240" r="300" fill="url(#glow3)"/>
  
  <!-- Circular Roundtable Nodes -->
  <g transform="translate(600, 220)" stroke="url(#accent3)" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="75" stroke-dasharray="4,4" opacity="0.6"/>
    <!-- 5 Agent Nodes around the table -->
    <circle cx="0" cy="-75" r="14" fill="#10b981" fill-opacity="0.4"/>
    <circle cx="71" cy="-23" r="14" fill="#10b981" fill-opacity="0.4"/>
    <circle cx="44" cy="61" r="14" fill="#10b981" fill-opacity="0.4"/>
    <circle cx="-44" cy="61" r="14" fill="#10b981" fill-opacity="0.4"/>
    <circle cx="-71" cy="-23" r="14" fill="#10b981" fill-opacity="0.4"/>
    <!-- Central Hub -->
    <circle cx="0" cy="0" r="22" fill="#34d399" fill-opacity="0.3"/>
    <line x1="0" y1="-75" x2="0" y2="0"/>
    <line x1="71" y1="-23" x2="0" y2="0"/>
    <line x1="44" y1="61" x2="0" y2="0"/>
    <line x1="-44" y1="61" x2="0" y2="0"/>
    <line x1="-71" y1="-23" x2="0" y2="0"/>
  </g>

  <!-- Badge -->
  <rect x="445" y="345" width="310" height="36" rx="18" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="600" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="3">MULTI-AGENT CONSENSUS</text>

  <!-- Title -->
  <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">Multi-Agent Roundtable System</text>
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#a7f3d0" text-anchor="middle">Autonomous LLM Consensus &amp; Peer Evaluation Engine</text>

  <!-- Tech tags -->
  <g transform="translate(600, 540)" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    <text x="-180" y="0">Python</text>
    <circle cx="-135" cy="-4" r="3" fill="#10b981"/>
    <text x="-80" y="0">FastAPI</text>
    <circle cx="-30" cy="-4" r="3" fill="#10b981"/>
    <text x="35" y="0">Docker</text>
    <circle cx="95" cy="-4" r="3" fill="#10b981"/>
    <text x="175" y="0">LLM Routing</text>
  </g>
</svg>
