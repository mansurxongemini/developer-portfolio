<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <circle cx="600" cy="240" r="300" fill="url(#glow2)"/>
  
  <!-- Neural / Cognitive network nodes -->
  <g stroke="url(#accent2)" stroke-width="2" fill="none" opacity="0.8">
    <line x1="600" y1="180" x2="520" y2="230"/>
    <line x1="600" y1="180" x2="680" y2="230"/>
    <line x1="520" y1="230" x2="550" y2="300"/>
    <line x1="680" y1="230" x2="650" y2="300"/>
    <line x1="550" y1="300" x2="650" y2="300"/>
    <line x1="600" y1="180" x2="600" y2="260"/>
    
    <circle cx="600" cy="180" r="14" fill="#a855f7" fill-opacity="0.4"/>
    <circle cx="520" cy="230" r="10" fill="#38bdf8" fill-opacity="0.4"/>
    <circle cx="680" cy="230" r="10" fill="#38bdf8" fill-opacity="0.4"/>
    <circle cx="550" cy="300" r="10" fill="#a855f7" fill-opacity="0.4"/>
    <circle cx="650" cy="300" r="10" fill="#38bdf8" fill-opacity="0.4"/>
    <circle cx="600" cy="260" r="16" fill="#ec4899" fill-opacity="0.4"/>
  </g>

  <!-- Badge -->
  <rect x="460" y="345" width="280" height="36" rx="18" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.3"/>
  <text x="600" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#c084fc" text-anchor="middle" letter-spacing="3">COGNITIVE AI &amp; MEMORY</text>

  <!-- Title -->
  <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">Alloma AI Cognitive Engine</text>
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">Persistent Knowledge Architecture &amp; Interactive Learning</text>

  <!-- Tech tags -->
  <g transform="translate(600, 540)" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    <text x="-190" y="0">TypeScript</text>
    <circle cx="-135" cy="-4" r="3" fill="#a855f7"/>
    <text x="-75" y="0">Next.js</text>
    <circle cx="-30" cy="-4" r="3" fill="#a855f7"/>
    <text x="40" y="0">Pinecone</text>
    <circle cx="105" cy="-4" r="3" fill="#a855f7"/>
    <text x="180" y="0">OpenRouter</text>
  </g>
</svg>
